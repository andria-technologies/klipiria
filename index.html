<!DOCTYPE html>
<html lang="id" class="dark">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klipiria - AI Video Clipper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#111827',
                        cyanAccent: '#00f2fe',
                        magentaAccent: '#f72585'
                    }
                }
            }
        }
    </script>
</head>
